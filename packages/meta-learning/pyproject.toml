[project]
name = "infinity-brain"
version = "0.1.0"
description = "Self-improving AGI foundation with 100-agent tournaments and meta-learning"
authors = [{name = "eKo.vision4"}]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
